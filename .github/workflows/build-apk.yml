name: Build Open Jarvis APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.2

      - name: Configure Gradle memory & enable AndroidX
        run: |
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError" >> $GITHUB_WORKSPACE/gradle.properties
          echo "android.useAndroidX=true" >> $GITHUB_WORKSPACE/gradle.properties
          echo "android.enableJetifier=true" >> $GITHUB_WORKSPACE/gradle.properties
          echo "org.gradle.parallel=false" >> $GITHUB_WORKSPACE/gradle.properties

      - name: Set GRADLE_OPTS
        run: |
          echo "GRADLE_OPTS=-Xmx2048m" >> $GITHUB_ENV

      - name: Clean Gradle
        run: ./gradlew clean --no-daemon

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace --info --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: open-jarvis-debug-apk
          path: app/build/outputs/apk/debug/*.apk